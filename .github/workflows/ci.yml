name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://steady:steady@localhost:5432/steady_state_test?schema=steadystate
      JWT_ACCESS_SECRET: ci_access_secret_ci_32_chars_min
      JWT_REFRESH_SECRET: ci_refresh_secret_ci_32_chars_min
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      TWILIO_MODE: mock
      CRM_MODE: fake
      BILLING_PROVIDER_MODE: mock
      NODE_ENV: test
      LOG_LEVEL: warn
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steady
          POSTGRES_PASSWORD: steady
          POSTGRES_DB: steady_state_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U steady"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steady-state/web exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @steady-state/web build
