name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steady
          POSTGRES_PASSWORD: steady
          POSTGRES_DB: steady_state_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U steady"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://steady:steady@localhost:5432/steady_state_test?schema=steadystate
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_ci_access_secret_ci_access
      JWT_REFRESH_SECRET: ci_refresh_secret_ci_refresh_secret_ci_refresh
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      TWILIO_ACCOUNT_SID: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      TWILIO_AUTH_TOKEN: ci-test-token
      TWILIO_WHATSAPP_FROM: 'whatsapp:+14155238886'
      TWILIO_MODE: mock
      CRM_MODE: fake
      DOOR_WEBHOOK_SECRET: ci-door-secret-ci-door-secret
      DATA_REGION: me-south-1
      BILLING_PROVIDER_MODE: mock
      NODE_ENV: test
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steady-state/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @steady-state/api build
      - run: pnpm --filter @steady-state/web build
